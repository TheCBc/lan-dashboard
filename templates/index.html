      'chart': '<line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line>',
      'play': '<polygon points="5 3 19 12 5 21 5 3"></polygon>',
      'code': '<polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline>'
    };

    const COLORS = ['#3b82f6', '#10b981', '#06b6d4', '#8b5cf6', '#f59e0b', '#ec4899', '#ef4444', '#64748b'];

    function renderIcon(iconKey, color) {
      if (ICONS[iconKey]) {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="${color || '#fff'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[iconKey]}</svg>`;
      }
      return `<span style="font-size: 1.4rem; line-height: 1;">${iconKey || '🌐'}</span>`;
    }

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clockTime').textContent = `${h}:${m}:${s}`;
      const options = { weekday: 'short', day: 'numeric', month: 'short' };
      document.getElementById('clockDate').textContent = now.toLocaleDateString('it-IT', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ==========================================
    // RENDER GRIGLIA PRINCIPALE CON ORDINAMENTO E DRAG & DROP
    // ==========================================

    function renderServices(filterQuery = '') {
      const grid = document.getElementById('servicesGrid');
      const q = filterQuery.toLowerCase().trim();

      // Mappatura delle categorie e dei relativi servizi
      const folderMap = {};
      categories.forEach(c => {
        folderMap[c.name] = {
          config: c,
          services: []
        };
      });

      const rootServiceMap = {};

      services.forEach(s => {
        const cat = (s.category || '').trim();
        if (cat) {
          if (!folderMap[cat]) {
            folderMap[cat] = {
              config: { name: cat, icon: 'folder', color: '#8b5cf6' },
              services: []
            };
          }
          folderMap[cat].services.push(s);
        } else {
          rootServiceMap[s.id] = s;
        }
      });

      // Costruiamo la lista ordinata di elementi root in base a rootOrder
      const displayItems = [];
      const usedKeys = new Set();

      (rootOrder || []).forEach(key => {
        if (key.startsWith('cat:')) {
          const catName = key.substring(4);
          if (folderMap[catName]) {
            displayItems.push({ type: 'folder', key: key, name: catName, data: folderMap[catName] });
            usedKeys.add(key);
          }
        } else if (rootServiceMap[key]) {
          displayItems.push({ type: 'service', key: key, data: rootServiceMap[key] });
          usedKeys.add(key);
        }
      });

      // Aggiungi eventuali cartelle non presenti in rootOrder
      Object.keys(folderMap).forEach(catName => {
        const key = `cat:${catName}`;
        if (!usedKeys.has(key)) {
          displayItems.push({ type: 'folder', key: key, name: catName, data: folderMap[catName] });
          usedKeys.add(key);
        }
      });

      // Aggiungi eventuali servizi root non presenti in rootOrder
      Object.keys(rootServiceMap).forEach(sid => {
        if (!usedKeys.has(sid)) {
          displayItems.push({ type: 'service', key: sid, data: rootServiceMap[sid] });
          usedKeys.add(sid);
        }
      });

      let html = '';
      let matchCount = 0;

      displayItems.forEach((item, index) => {
        if (item.type === 'folder') {
          const catName = item.name;
          const folder = item.data;
          const folderSvcs = folder.services;
          const conf = folder.config;

          // Se stiamo cercando, filtriamo
          let matches = folderSvcs;
          if (q) {
            matches = folderSvcs.filter(s => 
              (s.name && s.name.toLowerCase().includes(q)) ||
              (s.subtitle && s.subtitle.toLowerCase().includes(q)) ||
              (s.url && s.url.toLowerCase().includes(q)) ||
              catName.toLowerCase().includes(q)
            );
            if (matches.length === 0 && !catName.toLowerCase().includes(q)) {
              return;
            }
          }

          matchCount++;

          // Status sintetico
          let onlineCount = 0;
          let offlineCount = 0;
          folderSvcs.forEach(s => {
            const st = statuses[s.id];
            if (st && st.online === true) onlineCount++;
            else if (st && st.online === false) offlineCount++;
          });

          let folderStatusClass = 'checking';
          let folderStatusTooltip = `${catName} &bull; ${folderSvcs.length} servizi`;
          if (folderSvcs.length > 0) {
            if (onlineCount === folderSvcs.length) {
              folderStatusClass = 'online';
              folderStatusTooltip = `${catName} &bull; Tutti i ${folderSvcs.length} servizi online`;
            } else if (offlineCount === folderSvcs.length) {
              folderStatusClass = 'offline';
              folderStatusTooltip = `${catName} &bull; Tutti offline`;
            } else if (onlineCount > 0) {
              folderStatusClass = 'checking';
              folderStatusTooltip = `${catName} &bull; ${onlineCount}/${folderSvcs.length} online`;
            }
          }

          const fColor = conf.color || '#8b5cf6';
          const fIcon = conf.icon || 'folder';
          const itemKey = `cat:${catName}`;

          html += `
            <div class="card card-folder" 
                 data-key="${escapeHtml(itemKey)}"
                 data-category="${escapeHtml(catName)}"
                 draggable="true"
                 ondragstart="onCardDragStart(event, '${escapeHtml(itemKey)}')"
                 ondragend="onCardDragEnd(event)"
                 ondragover="onCardDragOver(event, '${escapeHtml(itemKey)}')"
                 ondragleave="onCardDragLeave(event)"
                 ondrop="onCardDrop(event, '${escapeHtml(itemKey)}')"
                 onclick="openFolderModal('${escapeHtml(catName)}')" 
                 style="border-left: 3px solid ${fColor};"
                 title="Clicca per aprire la cartella. Trascina un servizio sopra per inserirlo!">
              <div>
                <div class="card-top">
                  <div class="icon-wrapper" style="border-color: ${fColor}44; background: ${fColor}20;">
                    ${renderIcon(fIcon, fColor)}
                  </div>
                  <div class="status-container" title="${folderStatusTooltip.replace('&bull;', '•')}">
                    <div class="status-dot ${folderStatusClass}"></div>
                    <div class="tooltip">${folderStatusTooltip}</div>
                  </div>
                </div>

                <div class="card-body">
                  <div class="card-title">
                    <span>${escapeHtml(catName)}</span>
                    <span class="folder-badge">Cartella</span>
                  </div>
                  <div class="card-subtitle" style="font-family: inherit; color: var(--text-muted);">
                    ${folderSvcs.length} ${folderSvcs.length === 1 ? 'servizio' : 'servizi'} archiviati
                  </div>
                </div>
              </div>

              <div class="card-actions" onclick="event.stopPropagation();">
                <button class="action-btn" onclick="openFolderModal('${escapeHtml(catName)}')" title="Apri Cartella">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"></path><path d="M10 14L21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
                  <span>Apri</span>
                </button>
              </div>
            </div>
          `;
        } else {
          // Servizio Root
          const svc = item.data;
          if (q) {
            const matches = (svc.name && svc.name.toLowerCase().includes(q)) ||
                            (svc.subtitle && svc.subtitle.toLowerCase().includes(q)) ||
                            (svc.url && svc.url.toLowerCase().includes(q));
            if (!matches) return;
          }
          matchCount++;
          html += renderServiceCardHtml(svc, false);
        }
      });

      if (matchCount === 0 && q) {
        grid.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <p>Nessun servizio o cartella corrisponde a "<strong>${escapeHtml(q)}</strong>"</p>
          </div>
        `;
        return;
      }

      // Card Aggiungi Nuova
      if (!q) {
        html += `
          <div class="card card-add" onclick="openAddModal()">
            <div class="card-add-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
            <div class="card-add-text">Aggiungi Servizio</div>
          </div>
        `;
      }

      grid.innerHTML = html;
    }

    // Helper: genera HTML per una card servizio con supporto Drag & Drop
    function renderServiceCardHtml(svc, isInFolder = false) {
      const sid = svc.id;
      const status = statuses[sid] || { online: null, latency_ms: null, detail: 'In attesa...' };
      
      let statusClass = 'checking';
      let tooltipText = 'Verifica in corso...';
      
      if (status.online === true) {
        statusClass = 'online';
        tooltipText = `Online &bull; ${status.latency_ms ? status.latency_ms + 'ms' : 'OK'}`;
        if (status.detail) tooltipText += ` (${status.detail})`;
      } else if (status.online === false) {
        statusClass = 'offline';
        tooltipText = `Offline &bull; ${status.detail || 'Non raggiungibile'}`;
      }

      const targetAttr = svc.new_tab ? 'target="_blank" rel="noopener noreferrer"' : '';
      const iconColor = svc.color || '#3b82f6';
      const folderAttr = isInFolder ? (svc.category || '') : '';

      return `
        <a class="card" 
           href="${escapeHtml(svc.url)}" 
           ${targetAttr} 
           data-key="${sid}"
           data-id="${sid}"
           data-folder="${escapeHtml(folderAttr)}"
           draggable="true"
           ondragstart="onCardDragStart(event, '${sid}', '${escapeHtml(folderAttr)}')"
           ondragend="onCardDragEnd(event)"
           ondragover="onCardDragOver(event, '${sid}')"
           ondragleave="onCardDragLeave(event)"
           ondrop="onCardDrop(event, '${sid}')"
           title="Trascina per riordinare o rilascia sopra una cartella!">
          <div>
            <div class="card-top">
              <div class="icon-wrapper" style="border-color: ${iconColor}33; background: ${iconColor}15;">
                ${renderIcon(svc.icon, iconColor)}
              </div>
              <div class="status-container" title="${tooltipText.replace('&bull;', '•')}">
                <div class="status-dot ${statusClass}"></div>
                <div class="tooltip">${tooltipText}</div>
              </div>
            </div>

            <div class="card-body">
              <div class="card-title" title="${escapeHtml(svc.name)}">${escapeHtml(svc.name)}</div>
              <div class="card-subtitle" title="${escapeHtml(svc.subtitle || svc.url)}">${escapeHtml(svc.subtitle || svc.url)}</div>
            </div>
          </div>

          <div class="card-actions" onclick="event.preventDefault(); event.stopPropagation();">
            ${isInFolder ? `
              <button class="action-btn" onclick="moveOutOfFolder('${sid}')" title="Sposta nella Home principale">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                <span>Home</span>
              </button>
            ` : ''}
            <button class="action-btn" onclick="openEditModal('${sid}')" title="Modifica">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button class="action-btn delete" onclick="deleteService('${sid}')" title="Elimina">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </a>
      `;
    }

    // ==========================================
    // LOGICA DRAG AND DROP FLUIDA & REATTIVA
    // ==========================================

    function onCardDragStart(e, key, fromFolder = '') {
      draggedItemKey = key;
      draggedFromFolder = fromFolder || null;
      e.dataTransfer.setData('text/plain', key);
      e.dataTransfer.effectAllowed = 'move';
      
      const card = e.currentTarget;
      setTimeout(() => {
        if (card) card.classList.add('is-dragging');
      }, 0);
    }

    function onCardDragEnd(e) {
      if (e.currentTarget) e.currentTarget.classList.remove('is-dragging');
      document.querySelectorAll('.drag-over-target, .folder-drop-hover, .is-dragging').forEach(el => {
        el.classList.remove('drag-over-target', 'folder-drop-hover', 'is-dragging');
      });
      draggedItemKey = null;
      draggedFromFolder = null;
    }

    function onCardDragOver(e, targetKey) {
      if (!draggedItemKey || draggedItemKey === targetKey) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';

      const targetEl = e.currentTarget;

      // Se stiamo trascinando un servizio sopra una cartella
      if (targetKey.startsWith('cat:') && !draggedItemKey.startsWith('cat:')) {
        targetEl.classList.add('folder-drop-hover');
      } else {
        targetEl.classList.add('drag-over-target');
      }
    }

    function onCardDragLeave(e) {
      e.currentTarget.classList.remove('drag-over-target', 'folder-drop-hover');
    }

    async function onCardDrop(e, targetKey) {
      e.preventDefault();
      e.stopPropagation();
      const targetEl = e.currentTarget;
      targetEl.classList.remove('drag-over-target', 'folder-drop-hover');

      if (!draggedItemKey || draggedItemKey === targetKey) return;

      const isDraggedService = !draggedItemKey.startsWith('cat:');
      const isTargetFolder = targetKey.startsWith('cat:');

      // CASO 1: Trascina un pulsante DENTRO una cartella
      if (isDraggedService && isTargetFolder) {
        const targetCategory = targetKey.substring(4);
        const item = services.find(s => s.id === draggedItemKey);
        if (!item) return;

        item.category = targetCategory;

        // Se era in rootOrder, rimuovilo
        if (rootOrder.includes(draggedItemKey)) {
          rootOrder = rootOrder.filter(k => k !== draggedItemKey);
        }

        renderServices(document.getElementById('searchInput').value);

        try {
          await fetch(`/api/links/${draggedItemKey}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ category: targetCategory })
          });
          await fetch('/api/layout/reorder', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order: rootOrder })
          });
        } catch (err) {
          console.error('Errore spostamento cartella:', err);
        }
        return;
      }

      // CASO 2: Riordino all'interno della modale cartella
      if (currentOpenFolder && isDraggedService && !isTargetFolder) {
        const folderSvcs = services.filter(s => (s.category || '').trim() === currentOpenFolder);
        const fromIdx = folderSvcs.findIndex(s => s.id === draggedItemKey);
        const toIdx = folderSvcs.findIndex(s => s.id === targetKey);

        if (fromIdx >= 0 && toIdx >= 0) {
          const [moved] = folderSvcs.splice(fromIdx, 1);
          folderSvcs.splice(toIdx, 0, moved);

          // Ricostruisci array generale
          const others = services.filter(s => (s.category || '').trim() !== currentOpenFolder);
          services = [...others, ...folderSvcs];

          renderFolderServicesGrid(folderSvcs, currentOpenFolder);

          try {
            await fetch('/api/links/reorder', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ order: services.map(s => s.id) })
            });
          } catch (err) {
            console.error('Errore riordino servizi:', err);
          }
        }
        return;
      }

      // CASO 3: Riordino nella griglia principale (Root Order di cartelle e pulsanti)
      if (!currentOpenFolder) {
        const fromIdx = rootOrder.indexOf(draggedItemKey);
        const toIdx = rootOrder.indexOf(targetKey);

        if (fromIdx >= 0 && toIdx >= 0) {
          const [moved] = rootOrder.splice(fromIdx, 1);
          rootOrder.splice(toIdx, 0, moved);

          renderServices(document.getElementById('searchInput').value);

          try {
            await fetch('/api/layout/reorder', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ order: rootOrder })
            });
          } catch (err) {
            console.error('Errore salvataggio layout:', err);
          }
        }
      }
    }

    // Drag & Drop Fuori dalla Cartella (Drop Zone di uscita)
    function onFolderExitDragOver(e) {
      if (!draggedItemKey || draggedItemKey.startsWith('cat:')) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.getElementById('folderExitZone').classList.add('drag-active');
    }

    function onFolderExitDragLeave(e) {
      document.getElementById('folderExitZone').classList.remove('drag-active');
    }

    async function onFolderExitDrop(e) {
      e.preventDefault();
      document.getElementById('folderExitZone').classList.remove('drag-active');

      if (!draggedItemKey || draggedItemKey.startsWith('cat:')) return;
      const sid = draggedItemKey;
      await moveOutOfFolder(sid);
    }

    // ==========================================
    // MODALE DEDICATA: CREA NUOVA CARTELLA
    // ==========================================

    function openCreateFolderModal() {
      document.getElementById('folderFormName').value = '';
      selectFolderIcon('folder');
      selectFolderColor('#8b5cf6');
      initFolderIconAndColorPickers();
      document.getElementById('createFolderModal').classList.add('open');
      setTimeout(() => document.getElementById('folderFormName').focus(), 50);
    }

    function closeCreateFolderModal() {
      document.getElementById('createFolderModal').classList.remove('open');
    }

    function initFolderIconAndColorPickers() {
      const grid = document.getElementById('folderIconPickerGrid');
      grid.innerHTML = Object.keys(ICONS).map(k => `
        <div class="icon-choice ${k === folderSelectedIcon ? 'selected' : ''}" data-icon="${k}" onclick="selectFolderIcon('${k}')" title="${k}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS[k]}</svg>
        </div>
      `).join('');

      const colorsEl = document.getElementById('folderColorPresets');
      colorsEl.innerHTML = COLORS.map(c => `
        <div class="color-swatch ${c === folderSelectedColor ? 'selected' : ''}" style="background: ${c};" onclick="selectFolderColor('${c}')"></div>
      `).join('');

      updateFolderIconPreview();
    }

    function selectFolderIcon(iconKey) {
      folderSelectedIcon = iconKey;
      document.getElementById('folderCustomIconInput').value = iconKey;
      document.querySelectorAll('#folderIconPickerGrid .icon-choice').forEach(el => {
        el.classList.toggle('selected', el.getAttribute('data-icon') === iconKey);
      });
      updateFolderIconPreview();
    }

    function onFolderCustomIconInput(val) {
      folderSelectedIcon = val.trim() || 'folder';
      document.querySelectorAll('#folderIconPickerGrid .icon-choice').forEach(el => {
        el.classList.toggle('selected', el.getAttribute('data-icon') === folderSelectedIcon);
      });
      updateFolderIconPreview();
    }

    function selectFolderColor(colorHex) {
      folderSelectedColor = colorHex;
      document.getElementById('folderFormColor').value = colorHex;
      document.querySelectorAll('#folderColorPresets .color-swatch').forEach(el => {
        el.classList.toggle('selected', el.style.backgroundColor === colorHex || el.style.background === colorHex);
      });
      updateFolderIconPreview();
    }

    function updateFolderIconPreview() {
      const preview = document.getElementById('folderIconPreview');
      preview.style.borderColor = folderSelectedColor + '44';
      preview.style.background = folderSelectedColor + '20';
      preview.innerHTML = renderIcon(folderSelectedIcon, folderSelectedColor);
    }

    async function handleCreateFolderSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('folderFormName').value.trim();
      if (!name) return;

      const btn = document.getElementById('saveFolderBtn');
      btn.disabled = true;

      try {
        const resp = await fetch('/api/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: name,
            icon: folderSelectedIcon,
            color: folderSelectedColor
          })
        });

        if (resp.ok) {
          const res = await resp.json();
          categories = res.categories || [];
          rootOrder = res.root_order || rootOrder;
          closeCreateFolderModal();
          renderServices();
        } else {
          const err = await resp.json();
          alert('Errore: ' + (err.error || 'Impossibile creare la cartella'));
        }
      } catch (err) {
        alert('Errore di connessione con il server');
      } finally {
        btn.disabled = false;
      }
    }

    // ==========================================
    // MODALE VISUALIZZAZIONE CARTELLA
    // ==========================================

    function openFolderModal(categoryName) {
      currentOpenFolder = categoryName;
      const folderConf = categories.find(c => c.name === categoryName) || { name: categoryName, icon: 'folder', color: '#8b5cf6' };
      const folderServices = services.filter(s => (s.category || '').trim() === categoryName);

      document.getElementById('folderModalTitle').textContent = categoryName;
      document.getElementById('folderModalSubtitle').textContent = `${folderServices.length} ${folderServices.length === 1 ? 'servizio' : 'servizi'}`;
      
      const iconWrap = document.getElementById('folderModalIcon');
      iconWrap.style.borderColor = (folderConf.color || '#8b5cf6') + '44';
      iconWrap.style.background = (folderConf.color || '#8b5cf6') + '20';
      iconWrap.innerHTML = renderIcon(folderConf.icon || 'folder', folderConf.color || '#8b5cf6');

      renderFolderServicesGrid(folderServices, categoryName);
      document.getElementById('folderModal').classList.add('open');
    }

    function closeFolderModal() {
      document.getElementById('folderModal').classList.remove('open');
      currentOpenFolder = null;
      renderServices(document.getElementById('searchInput').value);
    }

    function renderFolderServicesGrid(folderServices, categoryName) {
      const grid = document.getElementById('folderServicesGrid');
      let html = '';

      folderServices.forEach((svc) => {
        html += renderServiceCardHtml(svc, true);
      });

      // Card Aggiungi a questa cartella
      html += `
        <div class="card card-add" onclick="openAddModal('${escapeHtml(categoryName)}')">
          <div class="card-add-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </div>
          <div class="card-add-text">Aggiungi a ${escapeHtml(categoryName)}</div>
        </div>
      `;

      grid.innerHTML = html;
    }

    async function moveOutOfFolder(sid) {
      const item = services.find(s => s.id === sid);
      if (!item) return;

      try {
        const resp = await fetch(`/api/links/${sid}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ category: null })
        });
        if (resp.ok) {
          const res = await resp.json();
          item.category = null;
          rootOrder = res.root_order || rootOrder;

          if (currentOpenFolder) {
            const remaining = services.filter(s => (s.category || '').trim() === currentOpenFolder);
            renderFolderServicesGrid(remaining, currentOpenFolder);
            document.getElementById('folderModalSubtitle').textContent = `${remaining.length} servizi`;
          }
          renderServices(document.getElementById('searchInput').value);
        }
      } catch (err) {
        alert('Errore spostamento servizio');
      }
    }

    async function editCurrentFolder() {
      if (!currentOpenFolder) return;
      const current = currentOpenFolder;
      const next = prompt('Nuovo nome per la cartella:', current);
      if (!next || !next.trim() || next.trim() === current) return;

      try {
        const resp = await fetch('/api/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ old_name: current, name: next.trim(), icon: 'folder', color: '#8b5cf6' })
        });
        if (resp.ok) {
          await reloadServices();
          openFolderModal(next.trim());
        }
      } catch (err) {
        alert('Errore rinomina cartella');
      }
    }

    async function deleteCurrentFolder() {
      if (!currentOpenFolder) return;
      if (!confirm(`Eliminare la cartella "${currentOpenFolder}"? I servizi contenuti NON verranno eliminati ma spostati nella pagina principale (Home).`)) return;

      try {
        const resp = await fetch(`/api/categories/${encodeURIComponent(currentOpenFolder)}`, {
          method: 'DELETE'
        });
        if (resp.ok) {
          closeFolderModal();
          await reloadServices();
        }
      } catch (err) {
        alert('Errore eliminazione cartella');
      }
    }

    // ==========================================
    // HEALTH CHECK & REFRESH
    // ==========================================

    async function refreshStatus() {
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('spinning');
      
      services.forEach(s => {
        if (!statuses[s.id]) statuses[s.id] = {};
        statuses[s.id].online = null;
      });
      renderServices(document.getElementById('searchInput').value);

      try {
        const resp = await fetch('/api/status');
        if (resp.ok) {
          const data = await resp.json();
          statuses = data.results || {};
        }
      } catch (err) {
        console.error('Status check error:', err);
      } finally {
        refreshIcon.classList.remove('spinning');
        renderServices(document.getElementById('searchInput').value);
        if (currentOpenFolder) {
          const folderServices = services.filter(s => (s.category || '').trim() === currentOpenFolder);
          renderFolderServicesGrid(folderServices, currentOpenFolder);
        }
      }
    }

    // ==========================================
    // RICERCA E FILTRI
    // ==========================================

    function filterServices() {
      const val = document.getElementById('searchInput').value;
      document.getElementById('searchClear').style.display = val ? 'block' : 'none';
      renderServices(val);
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      filterServices();
      document.getElementById('searchInput').focus();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      } else if (e.key === 'Escape') {
        closeModal();
        closeScanModal();
        closeFolderModal();
        closeCreateFolderModal();
        clearSearch();
      }
    });

    // ==========================================
    // SCANSIONE RETE CON SELEZIONE MULTIPLA
    // ==========================================

    function openScanModal() {
      document.getElementById('scanModal').classList.add('open');
      startNetworkScan();
    }

    function closeScanModal() {
      document.getElementById('scanModal').classList.remove('open');
      scannedDevices = [];
      selectedScannedIndices.clear();
    }

    async function startNetworkScan() {
      const body = document.getElementById('scanModalBody');
      const rescanBtn = document.getElementById('rescanBtn');
      const addSelectedBtn = document.getElementById('addSelectedBtn');
      
      if (rescanBtn) rescanBtn.disabled = true;
      if (addSelectedBtn) addSelectedBtn.disabled = true;
      selectedScannedIndices.clear();
      updateSelectedCountUi();

      body.innerHTML = `
        <div class="scan-radar-container">
          <div class="scan-radar">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a15 15 0 0 1 0 20M2 12a15 15 0 0 1 20 0"></path></svg>
          </div>
          <div>
            <h4 style="font-size:1rem; font-weight:600; margin-bottom:0.25rem;">Scansione LAN in corso...</h4>
            <p style="font-size:0.82rem; color:var(--text-muted);">Ricerca annunci mDNS e scansione porte comuni (80, 443, 8123, 8006, 8080)</p>
          </div>
        </div>
      `;

      try {
        const resp = await fetch('/api/scan');
        if (!resp.ok) throw new Error('Errore durante la scansione');
        const data = await resp.json();
        scannedDevices = data.devices || [];

        if (scannedDevices.length === 0) {
          body.innerHTML = `
            <div class="empty-state" style="padding: 2.5rem 1rem;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
              <p>Nessun nuovo dispositivo rilevato sulla subnet locale.</p>
            </div>
          `;
          return;
        }

        const existingUrls = new Set(services.map(s => s.url.replace(/\/+$/, '').toLowerCase()));

        let catOptions = `<option value="">🏠 Home (Nessuna cartella)</option>`;
        categories.forEach(c => {
          catOptions += `<option value="${escapeHtml(c.name)}">📁 ${escapeHtml(c.name)}</option>`;
        });

        let listHtml = `
          <div class="scan-toolbar">
            <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.85rem; cursor:pointer; user-select:none;">
              <input type="checkbox" id="scanSelectAll" class="scanned-checkbox" onchange="toggleSelectAllScanned(this.checked)">
              <span><strong>Seleziona tutti</strong> (${scannedDevices.length} dispositivi)</span>
            </label>

            <div style="display:flex; align-items:center; gap:0.4rem; font-size:0.82rem;">
              <span style="color:var(--text-muted);">Destinazione:</span>
              <select id="scanTargetCategory" class="form-input" style="padding:0.3rem 0.6rem; font-size:0.8rem;">
                ${catOptions}
              </select>
            </div>
          </div>

          <div class="scanned-list" id="scannedListContainer">
        `;

        scannedDevices.forEach((dev, idx) => {
          const isAdded = existingUrls.has(dev.url.replace(/\/+$/, '').toLowerCase());
          const isMdns = dev.source === 'mDNS';
          const badgeClass = isMdns ? 'badge-source mdns' : 'badge-source';
          const iconColor = dev.color || '#3b82f6';

          listHtml += `
            <div class="scanned-item" id="scanned-row-${idx}" onclick="handleScanRowClick(${idx}, event)">
              <div style="display:flex; align-items:center; gap:0.75rem; min-width:0; flex:1;">
                ${isAdded ? 
                  `<span style="width:18px;"></span>` : 
                  `<input type="checkbox" class="scanned-checkbox scan-item-cb" data-idx="${idx}" onchange="toggleScannedItem(${idx}, this.checked)" onclick="event.stopPropagation()">`
                }
                <div class="icon-wrapper" style="width:36px; height:36px; border-color:${iconColor}33; background:${iconColor}15; font-size:1.1rem;">
                  ${renderIcon(dev.icon, iconColor)}
                </div>
                <div class="scanned-details">
                  <div class="scanned-name">
                    <span>${escapeHtml(dev.name)}</span>
                    <span class="${badgeClass}">${escapeHtml(dev.source)}</span>
                  </div>
                  <div class="scanned-sub">${escapeHtml(dev.url)}</div>
                </div>
              </div>

              <div>
                ${isAdded ? 
                  `<span class="badge-added">Già presente</span>` : 
                  `<button class="btn btn-primary" style="padding:0.35rem 0.65rem; font-size:0.78rem;" onclick='addSingleScannedDevice(${idx}, this); event.stopPropagation();'>
                    + Aggiungi
                  </button>`
                }
              </div>
            </div>
          `;
        });

        listHtml += '</div>';
        body.innerHTML = listHtml;

      } catch (err) {
        body.innerHTML = `
          <div class="empty-state" style="padding: 2rem 1rem; color:#fca5a5;">
            <p>Errore durante la scansione: ${escapeHtml(err.message)}</p>
          </div>
        `;
      } finally {
        if (rescanBtn) rescanBtn.disabled = false;
      }
    }

    function handleScanRowClick(idx, event) {
      if (event.target.tagName === 'BUTTON' || event.target.tagName === 'INPUT') return;
      const cb = document.querySelector(`.scan-item-cb[data-idx="${idx}"]`);
      if (cb) {
        cb.checked = !cb.checked;
        toggleScannedItem(idx, cb.checked);
      }
    }

    function toggleScannedItem(idx, isChecked) {
      if (isChecked) selectedScannedIndices.add(idx);
      else selectedScannedIndices.delete(idx);
      const row = document.getElementById(`scanned-row-${idx}`);
      if (row) row.classList.toggle('checked', isChecked);
      updateSelectedCountUi();
    }

    function toggleSelectAllScanned(isChecked) {
      document.querySelectorAll('.scan-item-cb').forEach(cb => {
        cb.checked = isChecked;
        const idx = parseInt(cb.getAttribute('data-idx'));
        if (isChecked) selectedScannedIndices.add(idx);
        else selectedScannedIndices.delete(idx);
        const row = document.getElementById(`scanned-row-${idx}`);
        if (row) row.classList.toggle('checked', isChecked);
      });
      updateSelectedCountUi();
    }

    function updateSelectedCountUi() {
      const count = selectedScannedIndices.size;
      const btn = document.getElementById('addSelectedBtn');
      const info = document.getElementById('scanSelectedInfo');
      
      if (btn) {
        btn.disabled = count === 0;
        btn.textContent = `Aggiungi Selezionati (${count})`;
      }
      if (info) {
        info.textContent = count === 0 ? 'Nessun elemento selezionato' : `${count} elementi selezionati`;
      }
    }

    async function addSelectedScannedDevices() {
      if (selectedScannedIndices.size === 0) return;

      const targetCategory = document.getElementById('scanTargetCategory') ? 
                             document.getElementById('scanTargetCategory').value : '';

      const itemsToAdd = [];
      selectedScannedIndices.forEach(idx => {
        const dev = scannedDevices[idx];
        if (dev) {
          itemsToAdd.push({
            name: dev.name,
            url: dev.url,
            subtitle: dev.subtitle || dev.url,
            icon: dev.icon || 'globe',
            color: dev.color || '#3b82f6',
            new_tab: true,
            category: targetCategory || null
          });
        }
      });

      const btn = document.getElementById('addSelectedBtn');
      btn.disabled = true;
      btn.textContent = 'Importazione in corso...';

      try {
        const resp = await fetch('/api/links/bulk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: itemsToAdd, category: targetCategory })
        });

        if (resp.ok) {
          closeScanModal();
          await reloadServices();
          refreshStatus();
        } else {
          const err = await resp.json();
          alert('Errore importazione: ' + (err.error || 'Errore sconosciuto'));
          btn.disabled = false;
          btn.textContent = `Aggiungi Selezionati (${selectedScannedIndices.size})`;
        }
      } catch (err) {
        alert('Errore di comunicazione con il server');
        btn.disabled = false;
        btn.textContent = `Aggiungi Selezionati (${selectedScannedIndices.size})`;
      }
    }

    async function addSingleScannedDevice(idx, btn) {
      const dev = scannedDevices[idx];
      if (!dev) return;

      const targetCategory = document.getElementById('scanTargetCategory') ? 
                             document.getElementById('scanTargetCategory').value : '';

      btn.disabled = true;
      btn.textContent = 'Salvataggio...';

      try {
        const payload = {
          name: dev.name,
          url: dev.url,
          subtitle: dev.subtitle || dev.url,
          icon: dev.icon || 'globe',
          color: dev.color || '#3b82f6',
          new_tab: true,
          category: targetCategory || null
        };

        const resp = await fetch('/api/links', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (resp.ok) {
          btn.outerHTML = '<span style="color:var(--status-online); font-size:0.78rem; font-weight:600;">Aggiunto ✓</span>';
          await reloadServices();
          refreshStatus();
        } else {
          alert('Errore salvataggio servizio');
          btn.disabled = false;
          btn.textContent = '+ Aggiungi';
        }
      } catch (err) {
        alert('Errore di connessione');
        btn.disabled = false;
        btn.textContent = '+ Aggiungi';
      }
    }

    // ==========================================
    // MODALE AGGIUNGI / MODIFICA SERVIZIO
    // ==========================================

    function updateCategoryDropdown(selectedCategory = '') {
      const select = document.getElementById('serviceCategory');
      let html = `<option value="">🏠 Home (Nessuna cartella)</option>`;
      
      categories.forEach(c => {
        const isSel = c.name === selectedCategory ? 'selected' : '';
        html += `<option value="${escapeHtml(c.name)}" ${isSel}>📁 ${escapeHtml(c.name)}</option>`;
      });

      html += `<option value="__NEW__">➕ Crea nuova cartella...</option>`;
      select.innerHTML = html;
      document.getElementById('newCategoryInput').style.display = 'none';
      document.getElementById('newCategoryInput').value = '';
    }

    function onCategorySelectChange(val) {
      const input = document.getElementById('newCategoryInput');
      if (val === '__NEW__') {
        input.style.display = 'block';
        input.focus();
      } else {
        input.style.display = 'none';
      }
    }

    function openAddModal(preselectedCategory = '') {
      document.getElementById('modalTitle').textContent = preselectedCategory ? `Aggiungi Servizio a "${preselectedCategory}"` : 'Aggiungi Servizio';
      document.getElementById('serviceId').value = '';
      document.getElementById('serviceName').value = '';
      document.getElementById('serviceUrl').value = '';
      document.getElementById('serviceSubtitle').value = '';
      document.getElementById('serviceNewTab').checked = true;
      
      updateCategoryDropdown(preselectedCategory);
      selectIcon('globe');
      selectColor('#3b82f6');
      document.getElementById('serviceModal').classList.add('open');
      setTimeout(() => document.getElementById('serviceName').focus(), 50);
    }

    function openEditModal(sid) {
      const item = services.find(s => s.id === sid);
      if (!item) return;

      document.getElementById('modalTitle').textContent = 'Modifica Servizio';
      document.getElementById('serviceId').value = item.id;
      document.getElementById('serviceName').value = item.name || '';
      document.getElementById('serviceUrl').value = item.url || '';
      document.getElementById('serviceSubtitle').value = item.subtitle || '';
      document.getElementById('serviceNewTab').checked = item.new_tab !== false;
      
      updateCategoryDropdown(item.category || '');
      selectIcon(item.icon || 'globe');
      selectColor(item.color || '#3b82f6');
      document.getElementById('serviceModal').classList.add('open');
      setTimeout(() => document.getElementById('serviceName').focus(), 50);
    }

    function closeModal() {
      document.getElementById('serviceModal').classList.remove('open');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('serviceId').value;
      const catSelect = document.getElementById('serviceCategory').value;
      let finalCategory = catSelect;
      if (catSelect === '__NEW__') {
        finalCategory = document.getElementById('newCategoryInput').value.trim();
      }

      const payload = {
        name: document.getElementById('serviceName').value.trim(),
        url: document.getElementById('serviceUrl').value.trim(),
        subtitle: document.getElementById('serviceSubtitle').value.trim(),
        icon: selectedIcon,
        color: selectedColor,
        new_tab: document.getElementById('serviceNewTab').checked,
        category: finalCategory || null
      };

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;

      try {
        let resp;
        if (id) {
          resp = await fetch(`/api/links/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } else {
          resp = await fetch('/api/links', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        if (resp.ok) {
          closeModal();
          await reloadServices();
          if (currentOpenFolder) {
            openFolderModal(currentOpenFolder);
          }
          refreshStatus();
        } else {
          const err = await resp.json();
          alert('Errore: ' + (err.error || 'Impossibile salvare il servizio'));
        }
      } catch (err) {
        alert('Errore di connessione al server');
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteService(sid) {
      const item = services.find(s => s.id === sid);
      if (!confirm(`Sei sicuro di voler eliminare "${item ? item.name : 'questo servizio'}"?`)) return;

      try {
        const resp = await fetch(`/api/links/${sid}`, { method: 'DELETE' });
        if (resp.ok) {
          await reloadServices();
          if (currentOpenFolder) {
            openFolderModal(currentOpenFolder);
          }
        } else {
          alert('Impossibile eliminare il servizio');
        }
      } catch (err) {
        alert('Errore di comunicazione');
      }
    }

    async function reloadServices() {
      try {
        const resp = await fetch('/api/links');
        if (resp.ok) {
          const data = await resp.json();
          services = data.services || [];
          categories = data.categories || [];
          rootOrder = data.root_order || rootOrder;
          if (data.title) {
            document.getElementById('dashboardTitle').textContent = data.title;
            document.title = data.title;
          }
          renderServices(document.getElementById('searchInput').value);
        }
      } catch (err) {
        console.error('Reload error:', err);
      }
    }

    async function openTitlePrompt() {
      const current = document.getElementById('dashboardTitle').textContent;
      const next = prompt('Nome personalizzato della Dashboard:', current);
      if (next && next.trim() && next.trim() !== current) {
        try {
          const resp = await fetch('/api/title', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: next.trim() })
          });
          if (resp.ok) {
            document.getElementById('dashboardTitle').textContent = next.trim();
            document.title = next.trim();
          }
        } catch (err) {
          alert('Errore salvataggio titolo');
        }
      }
    }

    async function handleRestore(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (!confirm(`Ripristinare dal file "${file.name}"? I dati attuali verranno sovrascritti.`)) {
        event.target.value = '';
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      try {
        const resp = await fetch('/api/restore', { method: 'POST', body: formData });
        if (resp.ok) {
          alert('Ripristino completato con successo!');
          await reloadServices();
          refreshStatus();
        } else {
          const err = await resp.json();
          alert('Errore di ripristino: ' + (err.error || 'File non valido'));
        }
      } catch (err) {
        alert('Errore durante il ripristino');
      } finally {
        event.target.value = '';
      }
    }

    function initIconAndColorPickers() {
      const grid = document.getElementById('iconPickerGrid');
      grid.innerHTML = Object.keys(ICONS).map(k => `
        <div class="icon-choice ${k === selectedIcon ? 'selected' : ''}" data-icon="${k}" onclick="selectIcon('${k}')" title="${k}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS[k]}</svg>
        </div>
      `).join('');

      const colorsEl = document.getElementById('colorPresets');
      colorsEl.innerHTML = COLORS.map(c => `
        <div class="color-swatch ${c === selectedColor ? 'selected' : ''}" style="background: ${c};" onclick="selectColor('${c}')"></div>
      `).join('');
    }

    function selectIcon(iconKey) {
      selectedIcon = iconKey;
      document.getElementById('customIconInput').value = iconKey;
      document.querySelectorAll('#iconPickerGrid .icon-choice').forEach(el => {
        el.classList.toggle('selected', el.getAttribute('data-icon') === iconKey);
      });
      updateIconPreview();
    }

    function onCustomIconInput(val) {
      selectedIcon = val.trim() || 'globe';
      document.querySelectorAll('#iconPickerGrid .icon-choice').forEach(el => {
        el.classList.toggle('selected', el.getAttribute('data-icon') === selectedIcon);
      });
      updateIconPreview();
    }

    function selectColor(colorHex) {
      selectedColor = colorHex;
      document.getElementById('serviceColor').value = colorHex;
      document.querySelectorAll('#colorPresets .color-swatch').forEach(el => {
        el.classList.toggle('selected', el.style.backgroundColor === colorHex || el.style.background === colorHex);
      });
      updateIconPreview();
    }

    function updateIconPreview() {
      const preview = document.getElementById('iconPreview');
      preview.style.borderColor = selectedColor + '44';
      preview.style.background = selectedColor + '20';
      preview.innerHTML = renderIcon(selectedIcon, selectedColor);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initIconAndColorPickers();
      renderServices();
      refreshStatus();
      setInterval(refreshStatus, 60000);
    });
  </script>
</body>
</html>
